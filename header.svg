<svg width="1200" height="220" viewBox="0 0 1200 220"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Dark reference-style background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220">
      <stop offset="0%" stop-color="#030711"/>
      <stop offset="45%" stop-color="#081542"/>
      <stop offset="100%" stop-color="#02050D"/>
    </linearGradient>

    <!-- Blue / cyan / violet -->
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#1836B8"/>
      <stop offset="35%" stop-color="#147BFF"/>
      <stop offset="65%" stop-color="#16CFFF"/>
      <stop offset="82%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#1769E8"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="220" fill="url(#bg)"/>


  <!-- SOFT BLUE ATMOSPHERE -->

  <ellipse cx="850" cy="100"
           rx="330" ry="110"
           fill="#1265E8"
           opacity="0.12"
           filter="url(#softGlow)">

    <animate
      attributeName="cx"
      values="780;850;920;850;780"
      dur="10s"
      repeatCount="indefinite"/>
  </ellipse>


  <!-- ================================================= -->
  <!-- LARGE ORBITAL CURVE -->
  <!-- ================================================= -->

  <!-- glow -->

  <path
    d="M80 250
       C80 80 220 10 390 35
       C560 60 650 155 820 155
       C970 155 1080 85 1220 20"
    fill="none"
    stroke="#1769FF"
    stroke-width="18"
    opacity="0.18"
    filter="url(#glow)">

    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
      M80 250 C80 80 220 10 390 35 C560 60 650 155 820 155 C970 155 1080 85 1220 20;
      M80 250 C80 90 220 25 390 50 C560 75 650 135 820 140 C970 145 1080 105 1220 35;
      M80 250 C80 80 220 10 390 35 C560 60 650 155 820 155 C970 155 1080 85 1220 20"/>
  </path>


  <!-- bright edge -->

  <path
    d="M80 250
       C80 80 220 10 390 35
       C560 60 650 155 820 155
       C970 155 1080 85 1220 20"
    fill="none"
    stroke="url(#line)"
    stroke-width="5"
    stroke-linecap="round">

    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
      M80 250 C80 80 220 10 390 35 C560 60 650 155 820 155 C970 155 1080 85 1220 20;
      M80 250 C80 90 220 25 390 50 C560 75 650 135 820 140 C970 145 1080 105 1220 35;
      M80 250 C80 80 220 10 390 35 C560 60 650 155 820 155 C970 155 1080 85 1220 20"/>
  </path>


  <!-- ================================================= -->
  <!-- MIDDLE WAVING LIGHT LINES -->
  <!-- ================================================= -->

  <!-- Line 1 -->

  <path
    d="M0 105
       C130 70 200 135 330 105
       C460 75 520 75 650 110
       C780 145 850 130 980 95
       C1080 70 1140 80 1200 105"
    fill="none"
    stroke="url(#line)"
    stroke-width="2"
    opacity="0.8">

    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 105 C130 70 200 135 330 105 C460 75 520 75 650 110 C780 145 850 130 980 95 C1080 70 1140 80 1200 105;
      M0 105 C130 135 200 75 330 110 C460 145 520 130 650 95 C780 70 850 80 980 105 C1080 135 1140 75 1200 105;
      M0 105 C130 70 200 135 330 105 C460 75 520 75 650 110 C780 145 850 130 980 95 C1080 70 1140 80 1200 105"/>
  </path>


  <!-- Line 2 -->

  <path
    d="M0 125
       C140 155 220 90 350 125
       C480 160 550 155 680 120
       C810 85 900 95 1020 125
       C1100 145 1150 135 1200 115"
    fill="none"
    stroke="#168BFF"
    stroke-width="1.5"
    opacity="0.65">

    <animate
      attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
      M0 125 C140 155 220 90 350 125 C480 160 550 155 680 120 C810 85 900 95 1020 125 C1100 145 1150 135 1200 115;
      M0 125 C140 90 220 155 350 120 C480 85 550 95 680 125 C810 145 900 135 1020 115 C1100 90 1150 155 1200 125;
      M0 125 C140 155 220 90 350 125 C480 160 550 155 680 120 C810 85 900 95 1020 125 C1100 145 1150 135 1200 115"/>
  </path>


  <!-- Line 3 -->

  <path
    d="M0 145
       C120 115 210 170 330 140
       C450 110 550 110 670 145
       C790 180 890 160 1000 130
       C1100 105 1150 120 1200 140"
    fill="none"
    stroke="#756CFF"
    stroke-width="1.5"
    opacity="0.6">

    <animate
      attributeName="d"
      dur="9s"
      repeatCount="indefinite"
      values="
      M0 145 C120 115 210 170 330 140 C450 110 550 110 670 145 C790 180 890 160 1000 130 C1100 105 1150 120 1200 140;
      M0 145 C120 175 210 110 330 150 C450 180 550 160 670 125 C790 95 890 120 1000 150 C1100 175 1150 110 1200 145;
      M0 145 C120 115 210 170 330 140 C450 110 550 110 670 145 C790 180 890 160 1000 130 C1100 105 1150 120 1200 140"/>
  </path>


  <!-- ================================================= -->
  <!-- MOVING LIGHT POINTS -->
  <!-- ================================================= -->

  <circle r="3" fill="#7DEBFF">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M0 105 C130 70 200 135 330 105 C460 75 520 75 650 110 C780 145 850 130 980 95 C1080 70 1140 80 1200 105"/>
  </circle>

  <circle r="2.5" fill="#8C7CFF">

    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      path="M1200 125 C1100 145 1150 135 1020 125 C900 95 810 85 680 120 C550 155 480 160 350 125 C220 90 140 155 0 125"/>
  </circle>


  <!-- ================================================= -->
  <!-- TEXT -->
  <!-- ================================================= -->

  <text
    x="75"
    y="92"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="600">
    Amina Saaidia
  </text>

  <text
    x="78"
    y="120"
    fill="#BFD3FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    letter-spacing="1.2">
    PROCESS ENGINEERING · APPLIED AI
  </text>

  <rect
    x="78"
    y="137"
    width="55"
    height="2"
    rx="1"
    fill="#19D5FF"/>

</svg>
