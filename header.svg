<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="260"
     viewBox="0 0 1200 260">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1200" y2="260">
      <stop offset="0%" stop-color="#02050D"/>
      <stop offset="35%" stop-color="#071438"/>
      <stop offset="65%" stop-color="#0B1745"/>
      <stop offset="100%" stop-color="#02050D"/>
    </linearGradient>

    <radialGradient id="blueAtmosphere"
                    cx="70%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1769E8" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#123CA8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#02050D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetAtmosphere"
                    cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#756CFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#756CFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAtmosphere"
                    cx="75%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#19D5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#19D5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="blueLine"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1837B8"/>
      <stop offset="40%" stop-color="#147BFF"/>
      <stop offset="72%" stop-color="#19D5FF"/>
      <stop offset="100%" stop-color="#756CFF"/>
    </linearGradient>

    <linearGradient id="refineryFade"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#01050D" stop-opacity="0.88"/>
      <stop offset="38%" stop-color="#030914" stop-opacity="0.78"/>
      <stop offset="72%" stop-color="#071125" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#071438" stop-opacity="0.05"/>
    </linearGradient>

    <!-- SUBTLE BALL GLOW -->
    <filter id="smallBallGlow"
            x="-200%" y="-200%"
            width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <filter id="largeGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="lineGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>


  <!-- ============================================== -->
  <!-- BACKGROUND -->
  <!-- ============================================== -->

  <rect width="1200"
        height="260"
        fill="url(#background)"/>

  <rect width="1200"
        height="260"
        fill="url(#blueAtmosphere)"/>

  <rect width="1200"
        height="260"
        fill="url(#violetAtmosphere)"/>

  <rect width="1200"
        height="260"
        fill="url(#cyanAtmosphere)"/>


  <!-- ============================================== -->
  <!-- ATMOSPHERIC GLOW -->
  <!-- ============================================== -->

  <ellipse cx="850"
           cy="90"
           rx="330"
           ry="130"
           fill="#1769E8"
           opacity="0.08"
           filter="url(#largeGlow)">

    <animate
      attributeName="cx"
      values="760;850;940;850;760"
      dur="12s"
      repeatCount="indefinite"/>

  </ellipse>


  <ellipse cx="260"
           cy="50"
           rx="230"
           ry="75"
           fill="#756CFF"
           opacity="0.07"
           filter="url(#largeGlow)">

    <animate
      attributeName="cx"
      values="220;300;220"
      dur="11s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ============================================== -->
  <!-- LARGE BLUE CURVE -->
  <!-- ============================================== -->

  <path
    d="M40 285
       C100 150 170 55 315 35
       C470 12 590 95 690 150
       C790 205 900 185 1000 105
       C1080 42 1140 35 1240 20"
    fill="none"
    stroke="#147BFF"
    stroke-width="20"
    opacity="0.15"
    filter="url(#lineGlow)"/>

  <path
    d="M40 285
       C100 150 170 55 315 35
       C470 12 590 95 690 150
       C790 205 900 185 1000 105
       C1080 42 1140 35 1240 20"
    fill="none"
    stroke="url(#blueLine)"
    stroke-width="4"
    stroke-linecap="round"/>


