<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.45" stop-color="#071438"/>
      <stop offset="1" stop-color="#020611"/>
    </linearGradient>

    <!-- Main blue glow -->
    <linearGradient id="blueFlow" x1="150" y1="240" x2="1050" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102B91"/>
      <stop offset="0.42" stop-color="#1769E8"/>
      <stop offset="0.72" stop-color="#08B9E8"/>
      <stop offset="1" stop-color="#5B7CFF"/>
    </linearGradient>

    <!-- Violet highlight -->
    <linearGradient id="violetFlow" x1="250" y1="30" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315DFF"/>
      <stop offset="0.5" stop-color="#8C7CFF"/>
      <stop offset="1" stop-color="#42D9FF"/>
    </linearGradient>

    <!-- Soft blue glow -->
    <radialGradient id="blueGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(875 100) rotate(150) scale(430 180)">
      <stop stop-color="#1769E8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#123FC0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06112D" stop-opacity="0"/>
    </radialGradient>

    <!-- Violet glow -->
    <radialGradient id="violetGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(300 35) rotate(20) scale(300 90)">
      <stop stop-color="#8C72FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8C72FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(820 205) rotate(-20) scale(260 80)">
      <stop stop-color="#35D9FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#35D9FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Blur effects -->
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Main orbital shape -->
    <linearGradient id="orbital" x1="250" y1="240" x2="1000" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2A91"/>
      <stop offset="0.35" stop-color="#1265E8"/>
      <stop offset="0.65" stop-color="#22CFFF"/>
      <stop offset="0.82" stop-color="#7C7CFF"/>
      <stop offset="1" stop-color="#2E64FF"/>
    </linearGradient>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- Atmospheric glows -->
  <ellipse
    cx="850"
    cy="105"
    rx="430"
    ry="180"
    fill="url(#blueGlow)"
    filter="url(#blur40)"
  />

  <ellipse
    cx="310"
    cy="35"
    rx="300"
    ry="75"
    fill="url(#violetGlow)"
    filter="url(#blur40)"
  />

  <ellipse
    cx="850"
    cy="220"
    rx="250"
    ry="75"
    fill="url(#cyanGlow)"
    filter="url(#blur40)"
  />


  <!-- ===================================================== -->
  <!-- SOFT BACKGROUND LIGHT -->
  <!-- ===================================================== -->

  <path
    d="M -80 40
       C 160 -20, 290 -5, 430 45
       C 560 92, 680 105, 820 55"
    stroke="#315DFF"
    stroke-width="35"
    stroke-linecap="round"
    opacity="0.13"
    filter="url(#blur20)"
  />

  <path
    d="M 600 245
       C 730 185, 840 165, 1010 180
       C 1100 188, 1170 165, 1260 130"
    stroke="#8C7CFF"
    stroke-width="32"
    stroke-linecap="round"
    opacity="0.12"
    filter="url(#blur20)"
  />


  <!-- ===================================================== -->
  <!-- LARGE ORBITAL CURVE -->
  <!-- ===================================================== -->

  <!-- glow behind the main curve -->
  <path
    d="M 185 300
       C 160 205, 205 105, 300 48
       C 410 -20, 560 -12, 685 42
       C 790 88, 850 115, 930 104"
    stroke="#146BFF"
    stroke-width="42"
    stroke-linecap="round"
    opacity="0.16"
    filter="url(#blur20)"
  />

  <!-- main luminous curve -->
  <path
    d="M 185 300
       C 160 205, 205 105, 300 48
       C 410 -20, 560 -12, 685 42
       C 790 88, 850 115, 930 104"
    stroke="url(#orbital)"
    stroke-width="9"
    stroke-linecap="round"
    opacity="0.95"
  />

  <!-- thin bright edge -->
  <path
    d="M 185 300
       C 160 205, 205 105, 300 48
       C 410 -20, 560 -12, 685 42
       C 790 88, 850 115, 930 104"
    stroke="#A9F3FF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.85"
  />


  <!-- ===================================================== -->
  <!-- INNER FLOWING CURVE -->
  <!-- ===================================================== -->

  <path
    d="M 520 280
       C 555 220, 610 178, 690 158
       C 770 138, 835 145, 905 174
       C 1000 214, 1090 210, 1220 145"
    stroke="#1769E8"
    stroke-width="48"
    stroke-linecap="round"
    opacity="0.15"
    filter="url(#blur20)"
  />

  <path
    d="M 520 280
       C 555 220, 610 178, 690 158
       C 770 138, 835 145, 905 174
       C 1000 214, 1090 210, 1220 145"
    stroke="url(#violetFlow)"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.9"
  />

  <path
    d="M 520 280
       C 555 220, 610 178, 690 158
       C 770 138, 835 145, 905 174
       C 1000 214, 1090 210, 1220 145"
    stroke="#D4FAFF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.8"
  />


  <!-- ===================================================== -->
  <!-- CENTRAL BLUE LIGHT -->
  <!-- ===================================================== -->

  <ellipse
    cx="720"
    cy="112"
    rx="135"
    ry="75"
    fill="#087BFF"
    opacity="0.14"
    filter="url(#blur20)"
  />

  <ellipse
    cx="720"
    cy="112"
    rx="55"
    ry="32"
    fill="#35D9FF"
    opacity="0.16"
    filter="url(#blur10)"
  />


  <!-- ===================================================== -->
  <!-- SUBTLE TECHNICAL PARTICLES -->
  <!-- ===================================================== -->

  <circle cx="1010" cy="56" r="2" fill="#8BDFFF" opacity="0.7"/>
  <circle cx="1050" cy="82" r="1.5" fill="#587DFF" opacity="0.6"/>
  <circle cx="1100" cy="52" r="1" fill="#A59AFF" opacity="0.6"/>
  <circle cx="930" cy="35" r="1.5" fill="#6DE8FF" opacity="0.5"/>
  <circle cx="1130" cy="190" r="1.5" fill="#4E8CFF" opacity="0.5"/>
  <circle cx="980" cy="225" r="1" fill="#8C7CFF" opacity="0.6"/>


  <!-- ===================================================== -->
  <!-- TEXT -->
  <!-- ===================================================== -->

  <!-- subtle text glow -->
  <text
    x="92"
    y="108"
    fill="#4DA9FF"
    opacity="0.25"
    filter="url(#textGlow)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="600"
    letter-spacing="0.5"
  >
    Amina Saaidia
  </text>

  <!-- main name -->
  <text
    x="92"
    y="108"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="600"
    letter-spacing="0.5"
  >
    Amina Saaidia
  </text>

  <!-- subtitle -->
  <text
    x="94"
    y="138"
    fill="#B8CCFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="400"
    letter-spacing="1"
  >
    PROCESS ENGINEERING  ·  APPLIED AI
  </text>


  <!-- small accent line -->
  <rect
    x="94"
    y="154"
    width="55"
    height="2"
    rx="1"
    fill="#27CFFF"
    opacity="0.85"
  />

</svg>
